background {
    monitor =
    path = __HOME__/Pictures/ember.png
    blur_passes = 3
    brightness = 0.7
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(236, 229, 218, 1.0)
    font_size = 96
    font_family = Inter Bold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(168, 159, 147, 1.0)
    font_size = 18
    font_family = Inter
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.25
    outer_color = rgba(217, 119, 87, 1.0)
    inner_color = rgba(25, 23, 21, 0.85)
    font_color = rgba(236, 229, 218, 1.0)
    check_color = rgba(224, 184, 114, 1.0)
    fail_color = rgba(208, 103, 95, 1.0)
    placeholder_text = password
    rounding = 14
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
